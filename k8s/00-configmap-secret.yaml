apiVersion: v1
kind: ConfigMap
metadata:
  name: northstar-config
  labels:
    app.kubernetes.io/part-of: northstar-banking
data:
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
  EUREKA_URL: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  SPRING_DATASOURCE_URL_AUTH: "jdbc:mysql://mysql:3306/authdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_URL_CUSTOMER: "jdbc:mysql://mysql:3306/customerdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_URL_ACCOUNT: "jdbc:mysql://mysql:3306/accountdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "root"
---
apiVersion: v1
kind: Secret
metadata:
  name: northstar-secret
  labels:
    app.kubernetes.io/part-of: northstar-banking
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root"
  SPRING_DATASOURCE_PASSWORD: "root"
  JWT_SECRET: "northstar-bank-super-secret-key-change-me-12345"
